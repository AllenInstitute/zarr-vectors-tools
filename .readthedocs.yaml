version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    install:
      # zarr-vectors isn't needed at docs build time -- docs/conf.py mocks
      # it. Install the readers, then this package with --no-deps so pip
      # doesn't resolve zarr-vectors, then the Sphinx toolchain.
      - pip install numpy pandas laspy plyfile nibabel trx-python networkx scipy
      - pip install --no-deps .
      - pip install -r docs/requirements-docs.txt

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false
