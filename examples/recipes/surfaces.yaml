# A FreeSurfer subject in scanner space, with its morphometry and two
# parcellations, and a coarser level.  Run with:  zvtools run surfaces.yaml
# (A CIFTI map can be staged on with an attach step, but only one sampled on
# this subject's own mesh: an fs_LR map does not fit a native subject.)
name: cortical-surfaces
steps:
  - convert:
      input: data/subjects/bert
      output: out/bert.zv
      chunk_shape: [20, 20, 20]
      space: scanner
      annot: [aparc, aparc.a2009s]
  - pyramid:
      store: out/bert.zv
      coarsen: [2]
      sparsity: [1]
  - validate:
      store: out/bert.zv
