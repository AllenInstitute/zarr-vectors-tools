[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zarr-vectors-tools"
version = "0.2.0"
description = "Ingest and export workflows for the Zarr Vectors. Wraps third-party readers/writers (nibabel, laspy, plyfile, networkx, trx-python) on top of zarr-vectors."
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
authors = [
    {name = "Andrew Keenlyside"},
    {name = "Forrest Collman"},
]
keywords = ["zarr", "point-cloud", "mesh", "skeleton", "streamline", "connectomics", "spatial", "ingest", "export"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Core provides the read/write APIs, spatial/boundary helpers, and a basic
    # multi-scale layer; the rich coarsening/compute layer lives here in
    # zarr_vectors_tools.multiresolution.
    #
    # Two hard requirements on core, neither of which a version specifier can
    # actually express, because both are unreleased:
    #
    #  1. The merged links/<delta>/<offsets>/ layout (on-disk FORMAT 0.9.0):
    #     connectivity is one family and there is no cross_chunk_links/ to fall
    #     back to.
    #  2. The `zarr_vectors.building` surface.  Every import of core in this
    #     package goes through it -- `zarr_vectors.core`, `.spatial`,
    #     `.encoding`, `.lazy`, `.ops`, `.sharding` and `.multiresolution` are
    #     documented internal as of that commit, and reaching into them is what
    #     made each of core's last three layout refactors a downstream break.
    #     Against a core without `building`, this package fails at import.
    #
    # Core's PACKAGE version is still 0.2.x (setuptools-scm: 0.2.1.devN) --
    # format version, API surface and package version are all independent, so
    # the pin tracks the package and can only exclude the feature-less 0.2.0
    # release.  The real guarantee is an editable install of the core working
    # tree that carries both.
    "zarr-vectors>=0.2.1.dev0",
    # Inherited transitively from core (format 0.9.0 is zarr v3 only), but
    # declared here because this package imports zarr semantics through core's
    # group/array layer and would otherwise resolve against a v2 install.
    "zarr>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
las = ["laspy>=2.4"]
ply = ["plyfile>=1.0"]
# TRK (TrackVis) export/ingest. nibabel is pure Python and installs under
# Pyodide via micropip, so this extra is browser-installable on its own --
# hence the split from ``trx`` below, which is not.
trk = ["nibabel>=5.0"]
# TRX export/ingest. trx-python has no pyemscripten wheel, so this extra
# cannot be installed under Pyodide.
trx = ["trx-python>=0.3"]
# Back-compat alias: both streamline formats, unchanged for existing users.
streamlines = ["zarr-vectors-tools[trk,trx]"]
graph = ["networkx>=3.0"]
# AnnData (.h5ad) ingest/export -- single-cell and spatial-omics tables.
# anndata pulls h5py + scipy, so it stays an extra rather than a core dep.
h5ad = ["anndata>=0.10"]
points-enrichment = ["scipy>=1.10"]
# Mesh pyramid coarsening (quadric decimation + vertex clustering) in
# zarr_vectors_tools.multiresolution.strategies.meshes.
mesh = ["pyfqmr>=0.2", "scipy>=1.10"]
# Precomputed spatial-index skeleton ingest (`.frags` MapBuffers from a
# CloudVolume precomputed layer, e.g. flywire). Heavy readers kept out of
# the core library and gated behind this extra.
precomputed = ["cloud-volume>=8.0", "mapbuffer>=0.7", "cloud-files>=4.0"]
# Scale the ingest across worker processes (run_ingest(workers=...) / --workers).
parallel = ["dask[distributed]>=2024.0"]
# Requires a RAPIDS-compatible CUDA environment. Install per https://docs.rapids.ai.
gpu = ["cudf"]
all = [
    "laspy>=2.4",
    "plyfile>=1.0",
    "nibabel>=5.0",
    "trx-python>=0.3",
    "networkx>=3.0",
    "anndata>=0.10",
    "scipy>=1.10",
    "pyfqmr>=0.2",
    "cloud-volume>=8.0",
    "mapbuffer>=0.7",
    "cloud-files>=4.0",
    "dask[distributed]>=2024.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    # Both benchmark suites under benchmarks/ are Jupyter notebooks that
    # plot with matplotlib and tabulate with pandas (pandas is already a
    # runtime dep above).  They live here rather than in zarr-vectors-py
    # so the core package stays at numpy / numcodecs / zarr.
    "jupyter>=1.0",
    "matplotlib>=3.7",
]

[project.scripts]
zvtools = "zarr_vectors_tools.cli:main"

[tool.setuptools.packages.find]
include = ["zarr_vectors_tools*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two tiers.  The full suite takes ~30 minutes on one machine and longer when
# anything else is running, which is too slow to gate a pull request on, so the
# handful of tests that dominate it -- end-to-end TRK ingests and the ones that
# spawn worker processes -- carry the ``slow`` marker:
#
#     pytest -m "not slow"     # the fast tier, for every push
#     pytest                   # everything, before a merge
markers = [
    "slow: end-to-end ingests and process-pool tests (minutes, not seconds)",
]
filterwarnings = [
    # Zarr Vectors stores every per-chunk array as Zarr's variable-length-bytes dtype,
    # which has no stable Zarr v3 spec yet — the warning fires on every array
    # and drowns the test output.  Silence just that one category.
    "ignore::zarr.errors.UnstableSpecificationWarning",
]
